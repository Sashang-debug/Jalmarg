services:
  # ============================================================
  # LocalStack: Local AWS Cloud Emulator (Community Edition)
  # Emulates: DynamoDB, S3, SQS, EventBridge, Lambda, API Gateway
  # ============================================================
  localstack:
    container_name: jalmarg-localstack
    image: localstack/localstack:latest
    ports:
      - "4566:4566"            # LocalStack Edge Port
      - "4510-4559:4510-4559"  # External services port range
    environment:
      - SERVICES=dynamodb,s3,sqs,events,lambda
      - AWS_DEFAULT_REGION=ap-south-1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DEBUG=1
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./.localstack}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - jalmarg-network

  # ============================================================
  # OpenSearch: Geospatial Polygon & Vector Search Engine
  # ============================================================
  opensearch:
    container_name: jalmarg-opensearch
    image: opensearchproject/opensearch:2.11.0
    environment:
      - cluster.name=jalmarg-cluster
      - node.name=jalmarg-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true # Disabled for rapid local hackathon testing
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ports:
      - "9200:9200" # REST API
      - "9600:9600" # Performance Analyzer
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - jalmarg-network

networks:
  jalmarg-network:
    name: jalmarg-network
    driver: bridge

volumes:
  opensearch-data:
    name: jalmarg-opensearch-data
